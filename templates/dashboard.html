{% extends "base_app.html" %}

{% block title %}{{ labels.dashboard.page_title }}{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/dashboard.css') }}">
{% endblock %}

{% block content %}
<div id="dashboard-app" class="page-app">
    <header class="page-header">
        <div>
            <h1 class="page-title">{{ labels.dashboard.title }}</h1>
            <p class="page-subtitle">{{ labels.dashboard.subtitle }}</p>
        </div>
    </header>

    <div id="dashboard-content" class="dashboard-content">
        <p class="page-loading">{{ labels.dashboard.loading }}</p>
    </div>
</div>
{% endblock %}

{% block page_js %}
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script src="{{ url_for('static', filename='js/page.js') }}"></script>
{% endblock %}
