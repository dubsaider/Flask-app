{% extends "base_auth.html" %}

{% block title %}Вход — Kanban Board{% endblock %}

{% block content %}
<section class="login-page">
    <div class="login-card">
        <header class="login-header">
            <div class="login-logo" aria-hidden="true">KB</div>
            <h1 class="login-title">Kanban Board</h1>
            <p class="login-subtitle">Выберите пользователя для входа</p>
        </header>

        <div id="login-users-list" class="login-users-list">
            <p class="login-loading">Загрузка пользователей...</p>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
