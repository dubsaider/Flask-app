{% extends "base_auth.html" %}

{% block title %}{{ labels.auth.login_title }}{% endblock %}

{% block content %}
<section class="login-page">
    <div class="login-card">
        <header class="login-header">
            <div class="login-logo" aria-hidden="true">{{ labels.app.brand_short }}</div>
            <h1 class="login-title">{{ labels.app.name }}</h1>
            <p class="login-subtitle">{{ labels.auth.login_subtitle }}</p>
        </header>

        <div id="login-users-list" class="login-users-list">
            <p class="login-loading">{{ labels.auth.login_loading }}</p>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
