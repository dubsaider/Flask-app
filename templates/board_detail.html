{% extends "base.html" %}

{% block title %}Kanban Board{% endblock %}

{% block content %}
<div id="app">
    <!-- Заголовок доски -->
    <div class="board-header">
        <div>
            <h1 id="board-title">Loading...</h1>
            <p id="board-description"></p>
        </div>
        <div class="board-actions member-only" style="display:none;">
            <button class="btn btn-secondary" onclick="Modals.openBoard()">Edit Board</button>
            <button class="btn btn-danger" onclick="Board.deleteBoard()">Delete Board</button>
        </div>
    </div>
    
    <!-- Контейнер для колонок -->
    <div id="board-container" class="board-container">
        <!-- Динамически заполняется -->
    </div>
</div>

<!-- Модальные окна -->
{% include 'components/card_modal.html' %}
{% include 'components/board_modal.html' %}
{% include 'components/column_modal.html' %}
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/modal.js') }}"></script>
<script src="{{ url_for('static', filename='js/cards.js') }}"></script>
<script src="{{ url_for('static', filename='js/columns.js') }}"></script>
<script src="{{ url_for('static', filename='js/comments.js') }}"></script>
<script src="{{ url_for('static', filename='js/dragDrop.js') }}"></script>
<script src="{{ url_for('static', filename='js/board.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
