<!-- Модальное окно для добавления участника -->
<div id="add-member-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">Add Team Member</h2>
            <button class="btn-icon" onclick="Modals.closeAddMember()">✕</button>
        </div>
        <form id="add-member-form">
            <div class="form-group">
                <label for="user-select">Select User</label>
                <select id="user-select" required>
                    <option value="">Choose user...</option>
                </select>
            </div>
            <div class="form-group">
                <label for="role-select">Role</label>
                <select id="role-select">
                    <option value="developer">Developer</option>
                    <option value="leader">Leader</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="Modals.closeAddMember()">Cancel</button>
                <button type="submit" class="btn">Add</button>
            </div>
        </form>
    </div>
</div>
