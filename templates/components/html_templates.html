<!-- HTML-шаблоны для JS (cloneNode, без innerHTML) -->

<template id="tpl-login-user">
    <button type="button" class="login-user-item">
        <span class="login-user-avatar" data-field="avatar"></span>
        <span class="login-user-info">
            <span class="login-user-name" data-field="name"></span>
            <span class="login-user-email" data-field="email"></span>
        </span>
        <span class="login-user-arrow" aria-hidden="true">→</span>
    </button>
</template>

<template id="tpl-sidebar-team">
    <section class="sidebar-team-group">
        <h3 class="sidebar-team-name" data-field="team-name"></h3>
        <ul class="sidebar-board-list" data-field="board-list"></ul>
    </section>
</template>

<template id="tpl-sidebar-board">
    <li class="sidebar-board-item">
        <a class="sidebar-board-link" data-field="link" title="">
            <span class="sidebar-board-short" data-field="short" aria-hidden="true"></span>
            <span class="sidebar-board-title" data-field="title"></span>
        </a>
    </li>
</template>

<template id="tpl-board-column">
    <article class="column" data-field="column">
        <header class="column-header">
            <span class="column-drag-handle hidden" data-field="drag-handle" data-label-title="board.drag_column" aria-hidden="true">⠿</span>
            <button type="button" class="column-title" data-field="title-btn"></button>
            <button type="button" class="btn-icon column-menu-btn hidden" data-field="menu-btn" data-label-title="board.column_settings" aria-label="{{ labels.board.column_settings }}" title="{{ labels.board.column_settings }}">⚙</button>
        </header>
        <div class="cards-list" data-field="cards-list"></div>
        <button type="button" class="add-card-btn hidden" data-field="add-card-btn" data-label="board.add_card">+ Добавить карточку</button>
    </article>
</template>

<template id="tpl-card-item">
    <article class="card-item" data-field="card">
        <div class="card-item__stripe" data-field="priority-stripe"></div>
        <div class="card-item__body">
            <h4 class="card-item__title" data-field="title"></h4>
            <div class="card-item__meta">
                <span class="card-chip card-chip--priority" data-field="priority">
                    <span data-field="priority-text"></span>
                </span>
                <span class="card-chip card-chip--deadline hidden" data-field="deadline">
                    <span class="card-chip__icon" aria-hidden="true">📅</span>
                </span>
                <span class="card-chip card-chip--comments hidden" data-field="comments">
                    <span class="card-chip__icon" aria-hidden="true">💬</span>
                    <span data-field="comments-count"></span>
                </span>
            </div>
        </div>
        <span class="card-item__assignee hidden" data-field="assignee"></span>
    </article>
</template>

<template id="tpl-add-column-btn">
    <button type="button" class="add-column-btn" data-field="add-column-btn" data-label="board.add_column_btn">+ Добавить колонку</button>
</template>

<template id="tpl-comment-item">
    <article class="comment-item">
        <div class="comment-item__avatar" data-field="avatar"></div>
        <div class="comment-item__body">
            <header class="comment-header">
                <span class="comment-author" data-field="author"></span>
                <time class="comment-date" data-field="date"></time>
            </header>
            <p class="comment-text rich-text-content" data-field="text"></p>
        </div>
    </article>
</template>

<template id="tpl-state-action">
    <a class="btn" data-field="action-link"></a>
</template>

<template id="tpl-role-badge">
    <span class="role-badge" data-field="badge"></span>
</template>

<template id="tpl-task-group">
    <section class="task-group">
        <header class="task-group__header">
            <h2 class="task-group__title" data-field="title"></h2>
            <span class="task-group__count" data-field="count"></span>
        </header>
        <ul class="task-list" data-field="list"></ul>
    </section>
</template>

<template id="tpl-task-row">
    <li class="task-row">
        <a class="task-row__link" data-field="link">
            <span class="task-row__stripe" data-field="stripe"></span>
            <span class="task-row__body">
                <span class="task-row__title" data-field="title"></span>
                <span class="task-row__meta" data-field="meta"></span>
            </span>
        </a>
    </li>
</template>

<template id="tpl-stat-card">
    <article class="stat-card">
        <span class="stat-card__value" data-field="value"></span>
        <span class="stat-card__label" data-field="label"></span>
    </article>
</template>

<template id="tpl-dashboard-team">
    <section class="dashboard-team">
        <header class="dashboard-team__header">
            <h2 class="dashboard-team__title" data-field="team-name"></h2>
            <p class="dashboard-team__boards" data-field="boards"></p>
        </header>
        <div class="dashboard-team__stats" data-field="stats"></div>
        <div class="dashboard-team__grid">
            <div class="dashboard-panel" data-field="assignee-panel">
                <h3 class="dashboard-panel__title" data-label="dashboard.panel_assignees">{{ labels.dashboard.panel_assignees }}</h3>
                <div class="dashboard-panel__body" data-field="assignee-list"></div>
            </div>
            <div class="dashboard-panel" data-field="priority-panel">
                <h3 class="dashboard-panel__title" data-label="dashboard.panel_priority">{{ labels.dashboard.panel_priority }}</h3>
                <div class="dashboard-panel__body" data-field="priority-list"></div>
            </div>
            <div class="dashboard-panel dashboard-panel--wide" data-field="issues-panel">
                <h3 class="dashboard-panel__title" data-label="dashboard.panel_issues">{{ labels.dashboard.panel_issues }}</h3>
                <div class="dashboard-panel__body" data-field="issues-list"></div>
            </div>
        </div>
    </section>
</template>

<template id="tpl-assignee-bar">
    <div class="assignee-bar">
        <span class="assignee-bar__name" data-field="name"></span>
        <div class="assignee-bar__track">
            <div class="assignee-bar__fill" data-field="fill"></div>
        </div>
        <span class="assignee-bar__count" data-field="count"></span>
    </div>
</template>

<template id="tpl-priority-row">
    <div class="priority-row">
        <span class="priority-row__label" data-field="label"></span>
        <span class="priority-row__bar" data-field="bar"></span>
        <span class="priority-row__count" data-field="count"></span>
    </div>
</template>

<template id="tpl-issue-row">
    <a class="issue-row" data-field="link">
        <span class="issue-row__title" data-field="title"></span>
        <span class="issue-row__meta" data-field="meta"></span>
    </a>
</template>

<template id="tpl-empty-state">
    <div class="empty-state">
        <span class="empty-state__icon" data-field="icon"></span>
        <p class="empty-state__text" data-field="text"></p>
    </div>
</template>

<template id="tpl-notification-item">
    <button type="button" class="notification-item" data-field="item">
        <span class="notification-item__message" data-field="message"></span>
        <span class="notification-item__time" data-field="time"></span>
    </button>
</template>
