<!-- Модальное окно для доски -->
<div id="board-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title">Edit Board</h2>
            <button class="btn-icon" onclick="Modals.closeBoard()">✕</button>
        </div>
        <form id="board-form">
            <div class="form-group">
                <label for="board-title-input">Title</label>
                <input type="text" id="board-title-input" required>
            </div>
            <div class="form-group">
                <label for="board-description-input">Description</label>
                <textarea id="board-description-input"></textarea>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-secondary" onclick="Modals.closeBoard()">Cancel</button>
                <button type="submit" class="btn">Save</button>
            </div>
        </form>
    </div>
</div>
