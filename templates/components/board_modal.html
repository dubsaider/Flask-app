{% from 'macros/ui.html' import modal_close with context %}

<!-- Модальное окно доски -->
<div id="board-modal" class="modal modal--board">
    <div class="modal-dialog">
        <header class="modal-header modal-header--board">
            <div class="modal-header__leading">
                <span class="modal-header__icon" aria-hidden="true">📊</span>
                <h2 class="modal-title">{{ labels.board_modal.title }}</h2>
            </div>
            {{ modal_close('board-modal-close') }}
        </header>

        <div class="modal-body">
            <form id="board-form">
                <div class="form-group">
                    <label class="form-label" for="board-title-input">{{ labels.board_modal.name }}</label>
                    <input type="text" id="board-title-input" class="form-control" required placeholder="{{ labels.board_modal.name_placeholder }}">
                </div>
                <div class="form-group">
                    <label class="form-label" for="board-description-input">{{ labels.board_modal.description }}</label>
                    <textarea id="board-description-input" class="form-control form-control--textarea" placeholder="{{ labels.board_modal.description_placeholder }}"></textarea>
                </div>
                <footer class="form-actions">
                    <button type="button" class="btn btn-secondary" id="board-cancel-btn">{{ labels.common.cancel }}</button>
                    <button type="submit" class="btn btn-primary">{{ labels.common.save }}</button>
                </footer>
            </form>
        </div>
    </div>
</div>
