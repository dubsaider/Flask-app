<!-- Модальное окно доски -->
<div id="board-modal" class="modal modal--board">
    <div class="modal-dialog">
        <header class="modal-header modal-header--board">
            <div class="modal-header__leading">
                <span class="modal-header__icon" aria-hidden="true">📊</span>
                <h2 class="modal-title">Редактирование доски</h2>
            </div>
            <button type="button" class="modal-close-btn" id="board-modal-close" aria-label="Закрыть">✕</button>
        </header>

        <div class="modal-body">
            <form id="board-form">
                <div class="form-group">
                    <label class="form-label" for="board-title-input">Название</label>
                    <input type="text" id="board-title-input" class="form-control" required placeholder="Sprint 1">
                </div>
                <div class="form-group">
                    <label class="form-label" for="board-description-input">Описание</label>
                    <textarea id="board-description-input" class="form-control form-control--textarea" placeholder="Цели и контекст спринта"></textarea>
                </div>
                <footer class="form-actions">
                    <button type="button" class="btn btn-secondary" id="board-cancel-btn">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </footer>
            </form>
        </div>
    </div>
</div>
