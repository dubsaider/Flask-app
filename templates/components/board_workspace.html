<section id="board-workspace" class="board-workspace">
    <header class="board-header">
        <div class="board-header-info">
            <h1 class="board-title" id="board-title">Загрузка...</h1>
            <p class="board-description" id="board-description"></p>
            <div class="board-role-badge hidden" id="role-info"></div>
            <p class="board-role-desc hidden" id="role-description"></p>
        </div>

        <div class="board-actions leader-only hidden">
            <button type="button" class="btn btn-secondary" id="edit-board-btn">Редактировать</button>
            <button type="button" class="btn btn-danger" id="delete-board-btn">Удалить</button>
        </div>
    </header>

    {% include 'components/task_filters.html' %}

    <div id="board-state" class="board-state hidden">
        <div class="state-icon" id="board-state-icon" aria-hidden="true"></div>
        <h2 class="state-title" id="board-state-title"></h2>
        <p class="state-message" id="board-state-message"></p>
        <div class="state-actions" id="board-state-actions"></div>
    </div>

    <div id="board-container" class="board-container"></div>
</section>
