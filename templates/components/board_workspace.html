<section id="board-workspace" class="board-workspace">
    <header class="board-toolbar">
        <div class="board-toolbar__info">
            <h1 class="board-title" id="board-title">{{ labels.board.loading }}</h1>
            <p class="board-description hidden" id="board-description"></p>
        </div>

        <div class="board-toolbar__tools">
            <button
                type="button"
                class="board-filter-toggle"
                id="filter-toggle"
                aria-expanded="false"
                aria-controls="board-filters-panel"
            >
                <span class="board-filter-toggle__icon" aria-hidden="true">⌕</span>
                <span class="board-filter-toggle__label">{{ labels.board.filters }}</span>
                <span class="filter-result-count" id="filter-result-count"></span>
            </button>

            <div class="board-actions leader-only hidden">
                <button type="button" class="btn btn-secondary btn-sm" id="add-column-toolbar-btn">{{ labels.board.add_column }}</button>
                <button type="button" class="btn btn-secondary btn-sm" id="edit-board-btn">{{ labels.board.edit_board }}</button>
                <button type="button" class="btn btn-danger btn-sm" id="delete-board-btn">{{ labels.board.delete_board }}</button>
            </div>
        </div>
    </header>

    <div class="board-filters-panel hidden" id="board-filters-panel">
        {% include 'components/task_filters.html' %}
    </div>

    <div id="board-state" class="board-state hidden">
        <div class="state-icon" id="board-state-icon" aria-hidden="true"></div>
        <h2 class="state-title" id="board-state-title"></h2>
        <p class="state-message" id="board-state-message"></p>
        <div class="state-actions" id="board-state-actions"></div>
    </div>

    <div id="board-container" class="board-container"></div>
</section>
