<aside class="sidebar" id="sidebar">
    <div class="sidebar-inner">
        <header class="sidebar-header">
            <div class="sidebar-brand">
                <span class="sidebar-brand-icon" aria-hidden="true">KB</span>
                <span class="sidebar-brand-text">Kanban</span>
            </div>
            <div class="sidebar-header-actions">
                <button
                    type="button"
                    class="sidebar-notify-btn"
                    id="sidebar-notify-btn"
                    aria-expanded="false"
                    aria-controls="notifications-panel"
                    title="Уведомления"
                >
                    <span aria-hidden="true">🔔</span>
                    <span class="sidebar-notify-badge hidden" id="sidebar-notify-badge">0</span>
                </button>
                <button
                    type="button"
                    class="sidebar-collapse-btn"
                    id="sidebar-collapse-btn"
                    aria-expanded="true"
                    aria-label="Свернуть панель"
                    title="Свернуть панель"
                >
                    <span class="sidebar-collapse-icon" aria-hidden="true">‹</span>
                </button>
            </div>
        </header>

        <section class="sidebar-pages" id="sidebar-pages">
            <a href="/tasks" class="sidebar-page-link" id="nav-tasks" data-page="tasks">
                <span class="sidebar-page-icon" aria-hidden="true">✓</span>
                <span class="sidebar-page-text">Мои задачи</span>
            </a>
            <a href="/dashboard" class="sidebar-page-link hidden" id="nav-dashboard" data-page="dashboard">
                <span class="sidebar-page-icon" aria-hidden="true">📊</span>
                <span class="sidebar-page-text">Дашборд</span>
            </a>
            <a href="#" class="sidebar-page-link hidden" id="nav-team-settings" data-page="team-settings">
                <span class="sidebar-page-icon" aria-hidden="true">⚙</span>
                <span class="sidebar-page-text">Команда</span>
            </a>
        </section>

        <nav class="sidebar-nav" id="sidebar-nav" aria-label="Доски">
            <div class="sidebar-nav-scroll" id="sidebar-board-groups"></div>
        </nav>

        <footer class="sidebar-footer">
            <div class="sidebar-user" id="sidebar-user">
                <div class="sidebar-user-avatar" id="sidebar-user-avatar" aria-hidden="true">?</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name" id="sidebar-user-name">Guest</span>
                    <span class="sidebar-user-role" id="sidebar-user-role"></span>
                </div>
                <button type="button" class="sidebar-logout-btn" id="sidebar-logout-btn">Выйти</button>
            </div>
        </footer>

        <section class="notifications-panel hidden" id="notifications-panel" aria-label="Уведомления">
            <header class="notifications-panel__header">
                <h2 class="notifications-panel__title">Уведомления</h2>
                <div class="notifications-panel__actions">
                    <button type="button" class="btn btn-secondary btn-sm" id="notifications-read-all">Прочитать все</button>
                </div>
            </header>
            <div class="notifications-panel__list" id="notifications-list"></div>
        </section>
    </div>
</aside>
