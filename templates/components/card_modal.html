<!-- Модальное окно для карточки -->
<div id="card-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="card-modal-title">Card Details</h2>
            <button class="btn-icon" onclick="Modals.closeCard()">✕</button>
        </div>
        
        <!-- Форма редактирования (только для участников команды) -->
        <form id="card-form" class="card-form">
            <input type="hidden" id="card-id">
            <input type="hidden" id="card-column-id">
            
            <div class="form-group">
                <label for="card-title-input">Title</label>
                <input type="text" id="card-title-input" required>
            </div>
            
            <div class="form-group">
                <label for="card-description-input">Description</label>
                <textarea id="card-description-input"></textarea>
            </div>
            
            <!-- Назначение ответственного (только для руководителя) -->
            <div class="form-group leader-only" style="display:none;">
                <label for="card-assignee-input">Assignee</label>
                <select id="card-assignee-input">
                    <option value="">Unassigned</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="card-priority-input">Priority</label>
                <select id="card-priority-input">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                    <option value="critical">Critical</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="card-status-input">Status</label>
                <select id="card-status-input">
                    <option value="active">Active</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="card-deadline-input">Deadline</label>
                <input type="datetime-local" id="card-deadline-input">
            </div>
            
            <div class="form-actions member-only" style="display:none;">
                <button type="button" class="btn btn-danger" onclick="Cards.deleteCard()">Delete</button>
                <button type="button" class="btn btn-secondary" onclick="Modals.closeCard()">Cancel</button>
                <button type="submit" class="btn">Save</button>
            </div>
        </form>
        
        <!-- Секция для куратора (только просмотр) -->
        <div id="card-view-only" class="curator-only" style="display:none;">
            <div class="form-group">
                <label>Title</label>
                <p id="view-title" class="view-field"></p>
            </div>
            <div class="form-group">
                <label>Description</label>
                <p id="view-description" class="view-field"></p>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <p id="view-priority" class="view-field"></p>
            </div>
        </div>
        
        <!-- Комментарии (доступны всем) -->
        {% include 'components/comment_section.html' %}
    </div>
</div>
