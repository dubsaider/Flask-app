{% from 'macros/ui.html' import priority_options, workflow_options with context %}

<section class="task-filters" id="task-filters">
    <div class="task-filters__row">
        <div class="filter-group filter-group--search">
            <label class="filter-label" for="filter-search">{{ labels.filters.search }}</label>
            <input type="search" id="filter-search" class="form-control" placeholder="{{ labels.filters.search_placeholder }}">
        </div>

        <div class="filter-group">
            <label class="filter-label" for="filter-priority">{{ labels.filters.priority }}</label>
            <select id="filter-priority" class="form-control">
                {{ priority_options(include_all=true) }}
            </select>
        </div>

        <div class="filter-group">
            <label class="filter-label" for="filter-status">{{ labels.filters.status }}</label>
            <select id="filter-status" class="form-control">
                {{ workflow_options(include_all=true) }}
            </select>
        </div>

        <div class="filter-group filter-group--assignee">
            <label class="filter-label" for="filter-assignee">{{ labels.filters.assignee }}</label>
            <select id="filter-assignee" class="form-control">
                <option value="">{{ labels.common.all }}</option>
                <option value="unassigned">{{ labels.common.unassigned }}</option>
            </select>
        </div>
    </div>

    <div class="task-filters__row task-filters__row--checks">
        <label class="filter-check">
            <input type="checkbox" id="filter-overdue">
            <span>{{ labels.filters.overdue_only }}</span>
        </label>
        <label class="filter-check filter-check--mine hidden" id="filter-mine-wrap">
            <input type="checkbox" id="filter-mine">
            <span>{{ labels.filters.mine_only }}</span>
        </label>
        <button type="button" class="btn btn-secondary btn-sm" id="filter-reset">{{ labels.common.reset }}</button>
        <span class="filter-result-count filter-result-count--inline"></span>
    </div>
</section>
