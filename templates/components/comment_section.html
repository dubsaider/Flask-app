<div class="comments-section">
    <h3 class="comments-title">Comments</h3>
    
    <div id="comments-list" class="comments-list">
        <!-- Комментарии загружаются динамически -->
    </div>
    
    <!-- Форма добавления комментария (доступна всем) -->
    <div class="comment-form">
        <textarea id="comment-text" placeholder="Write a comment..." rows="3"></textarea>
        <button class="btn" onclick="Comments.addComment()">Send</button>
    </div>
</div>
