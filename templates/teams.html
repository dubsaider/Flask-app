{% extends "base.html" %}

{% block title %}Teams - Kanban Board{% endblock %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
    <h1>Teams</h1>
</div>

<div id="teams-container" class="grid">
    <!-- Данные будут загружены через JavaScript -->
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadTeams() {
    try {
        const response = await fetch('/api/teams');
        const teams = await response.json();
        
        const container = document.getElementById('teams-container');
        container.innerHTML = teams.map(team => `
            <div class="card">
                <h3>${team.name}</h3>
                <p style="color: #5e6c84; margin: 0.5rem 0;">${team.description || 'No description'}</p>
                <p style="font-size: 0.9rem; color: #5e6c84;">
                    Members: ${team.members.length}
                </p>
                <a href="/teams/${team.id}" class="btn" style="margin-top: 0.5rem;">View Team</a>
            </div>
        `).join('');
    } catch (error) {
        console.error('Error loading teams:', error);
    }
}

loadTeams();
</script>
{% endblock %}
